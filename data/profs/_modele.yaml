# MODÈLE pour un nouveau prof.
# 1. Copie ce fichier sous le nom <ton-courriel>.yaml (ex. marie.tremblay.yaml), sans @cegepmontpetit.ca
# 2. Remplis les champs ; les lignes qui commencent par # sont des commentaires (ignorés).
# 3. Ta page sera https://info.cegepmontpetit.ca/react/<ton-courriel>
# Mode d'emploi complet : https://info.cegepmontpetit.ca/react/modifier-mon-profil

nom: "Prénom Nom"
courriel: prenom.nom              # sans @cegepmontpetit.ca, identique au nom du fichier
contact: teams                    # ou mio : le bouton « Écris-moi » de ta page ouvre une conversation Teams avec toi, ou renvoie à MIO
bureau: "E-2xx"
# photo: prenom.jpg               # ajoute ta photo dans data/photos/ (format portrait de préférence)
# github: mon-pseudo
# linkedin: mon-profil
# site: https://mon-site.com
# presentation: "Une ou deux phrases pour te présenter aux étudiants."

# Tu es « actif » si tu as des cours cette session. Pour forcer l'un ou l'autre :
# actif: true                     # ex. coordination, sans cours
# actif: false                    # ex. congé, départ

cours: [420-1P6-EM]               # numéros des cours que tu donnes cette session
aide: [420-2P6-EM]                # autres cours pour lesquels tu peux aider au centre d'aide
session: H2027                    # A = automne, H = hiver, E = été

# ---------- Horaire de la semaine ----------
# type : cours, dispo, centre-aide, reunion ou autre
#   dispo : pour tes étudiants ; centre-aide : pour tous, selon « cours » et « aide » (page Centre d'aide)
# jour : lundi, mardi, mercredi, jeudi ou vendredi
# heures entre guillemets : "08:00"
horaire:
  debut: "08:00"                  # première heure affichée
  fin: "18:00"                    # dernière heure affichée
  plages:
    - { jour: lundi, debut: "08:00", fin: "11:00", type: cours, cours: 420-1P6-EM, groupe: 1010, local: D-0601 }
    - { jour: mardi, debut: "13:00", fin: "15:00", type: dispo, local: E-2xx }
    - { jour: mercredi, debut: "12:00", fin: "14:00", type: reunion, titre: Réunion de département }

# ---------- Calendrier : tes dates à toi ----------
# Les congés, journées pédagogiques et horaires modifiés du cégep sont ajoutés automatiquement.
# type : remise, examen, cours, absence, deplacement, activite ou autre
# absence : les cours et les dispos de ces jours sont annulés (ajoute cours: pour n'annuler qu'un cours), sans titre ni motif : elle paraît comme « Cours annulé »
# deplacement : le cours du jour « remplace » est repris à « date » (souvent une journée JR)
# evaluation : sommative ou formative (avec cours:, et groupe: au besoin) : la date paraît dans le calendrier
#   et les rappels des étudiants de ce cours (page Mes cours) ; une absence ou un déplacement y paraît aussi
calendrier:
  - { date: 2027-02-15, titre: Remise du TP1, cours: 420-1P6-EM, type: remise }
  - { date: 2027-03-22, titre: Examen intra, cours: 420-1P6-EM, type: examen, evaluation: sommative }
  - { date: 2027-03-01, titre: Quiz 1, cours: 420-1P6-EM, type: examen, evaluation: formative }
  - { date: 2027-04-05, au: 2027-04-06, type: absence }
  - { date: 2027-04-07, remplace: 2027-04-05, type: deplacement, cours: 420-1P6-EM, groupe: 1010 }   # ajoute debut, fin, local si différents
