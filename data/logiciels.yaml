# Logiciels gratuits pour les étudiants du département (page /logiciels).
# identifiant : comment se connecter ; lien : où s'inscrire ou télécharger.
# logo (facultatif) : nom d'un fichier placé dans web/public/images/logiciels/.
# tags ou cours (facultatifs) : les cours où il sert, mis en avant pour l'étudiant qui a indiqué ses cours (page Mes cours).
#   tags : ceux de data/cours.yaml (prog, web, mobile, os, reseau, serveurs, bd...) ; cours : [420-5N6-EM, ...]
- nom: GitHub Student Developer Pack
  logo: github.svg
  identifiant: ton courriel matricule@cegepmontpetit.ca
  description: "Le pack étudiant de GitHub Education : GitHub Pro, GitHub Copilot gratuit et des dizaines d'outils pros offerts (hébergement, domaines, IDE...). On utilise GitHub dans la plupart des cours pour gérer le code source."
  lien: https://education.github.com/pack
  bouton: Obtenir le pack étudiant
  vedette: true
- nom: JetBrains (IntelliJ, PyCharm, WebStorm, Rider...)
  logo: jetbrains.svg
  identifiant: matricule@cegepmontpetit.ca
  description: Toutes les versions « Ultimate » des IDE JetBrains, gratuites pendant ta technique. Utilisés pour Java, Python, le web, Android...
  lien: https://www.jetbrains.com/student/
  bouton: Licence étudiante JetBrains
  tags: [prog, python, web, mobile]
