# Source, automne 2026 : « Horaire du local » (RPHOR020, 2026-08-19), publié dans le dépôt du cours SN1 :
# https://github.com/departement-info-cem/420-SN1/blob/main/web/static/pdf/horairelabos.pdf
# Ce PDF ne contient que des images : il faut le recopier ici à la main à chaque session, puis changer « session ».
# Tant que ce n'est pas fait, le site dit « horaire incomplet » et n'affiche aucun local libre.
#
# Cours de 5 heures : ce sont 2 séances de 2 h 30, mais le PDF réserve 3 h. Quand deux d'entre eux se chevauchent
# (cadres rouges), on coupe au milieu : 08:10-10:30 puis 10:30-13:00. Sinon on garde la réservation de 3 h.
# « horsCalendrier: true » : groupe du soir (AEC) qui ne suit pas le calendrier scolaire (JR, relâche, horaire modifié...).
# « complet: true » dit que toutes les occupations de la session sont connues.
# Les cours inscrits dans les fiches des profs (data/profs) sont ajoutés automatiquement.

