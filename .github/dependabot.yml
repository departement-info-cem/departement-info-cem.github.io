# Mises à jour de sécurité et de versions, regroupées pour limiter le nombre de PR.
# Le site Angular (angular/) n'est pas suivi : il sera retiré à la bascule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
