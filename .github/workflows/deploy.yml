name: Déploiement

on:
  push:
    branches:
      - main
  # Chaque matin : reprend le calendrier scolaire officiel au cas où le cégep l'aurait modifié
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

# Le jeton GitHub ne peut que lire le dépôt (le job deploy reçoit ses propres droits plus bas)
permissions:
  contents: read

jobs:
  build:
    name: Build le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Utiliser Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # ---------- Site Next.js (web/), publié à la racine ----------
      - name: Installer les dépendances (React)
        working-directory: web
        run: npm ci

      # Si le site du cégep est en panne ou si le PDF change de forme, on garde le calendrier du dépôt.
      - name: Mettre à jour le calendrier scolaire (PDF du cégep)
        working-directory: web
        continue-on-error: true
        run: npm run calendrier

      - name: Valider les données (fiches des profs, grilles, FAQ...)
        working-directory: web
        run: npm run valider

      - name: Lint et tests (React)
        working-directory: web
        run: |
          npm run lint
          npm test

      - name: Build (React)
        working-directory: web
        run: npm run build

      - name: Fix permissions
        working-directory: web/out
        run: |
          chmod -c -R +rX "./" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Téléverser l'artéfact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out
          retention-days: 5
  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
