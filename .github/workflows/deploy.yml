name: Déploiement

on:
  push:
    branches:
      - main
  # Chaque matin : reprend le calendrier scolaire officiel au cas où le cégep l'aurait modifié
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

# Le jeton GitHub ne peut que lire le dépôt (le job deploy reçoit ses propres droits plus bas)
permissions:
  contents: read

jobs:
  build:
    name: Build le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Utiliser Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache de node modules
        id: cache-nodemodules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        env:
          cache-name: cache-node-modules
        with:
          path: angular/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Installer les dépendences
        working-directory: angular
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: |
          npm ci

      - name: Lint
        working-directory: angular
        run: npm run lint

      - name: Build
        working-directory: angular
        run: npm run build:prod

      - name: Fix 404.html
        working-directory: angular/dist/depinfo/browser
        run: |
          cp index.html 404.html

      # ---------- Nouveau site React (web/), publié sous /react/ ----------
      - name: Installer les dépendances (React)
        working-directory: web
        run: npm ci

      # Si le site du cégep est en panne ou si le PDF change de forme, on garde le calendrier du dépôt.
      - name: Mettre à jour le calendrier scolaire (PDF du cégep)
        working-directory: web
        continue-on-error: true
        run: npm run calendrier

      - name: Valider les données (fiches des profs, grilles, FAQ...)
        working-directory: web
        run: npm run valider

      - name: Lint et tests (React)
        working-directory: web
        run: |
          npm run lint
          npm test

      - name: Build (React)
        working-directory: web
        run: npm run build

      - name: Placer le site React sous /react/
        run: cp -r web/out angular/dist/depinfo/browser/react

      - name: Fix permissions
        working-directory: angular/dist/depinfo/browser
        run: |
          chmod -c -R +rX "./" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Téléverser l'artéfact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: angular/dist/depinfo/browser
          retention-days: 5
  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
