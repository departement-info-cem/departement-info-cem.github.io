name: Test déploiement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Mêmes étapes que deploy.yml (sans la publication) : voir les explications là-bas.
jobs:
  test-react:
    name: Test du site React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Utiliser Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Valider les données
        working-directory: web
        run: npm run valider
      - name: Reprendre la vérification des types du build précédent
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache/.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: tsbuildinfo-
      - name: Build
        working-directory: web
        run: npm run build

  lint-tests:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Utiliser Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Lint et tests
        working-directory: web
        run: |
          npm run lint
          npm test
